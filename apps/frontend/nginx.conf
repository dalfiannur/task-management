worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Preserve X-Forwarded-Proto from reverse proxy; fall back to $scheme for direct access
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Upstream backends
    upstream tasks-backend {
        server task-management-backend:3000;
    }

    upstream core-backend {
        server core-backend:3101;
    }

    upstream oidc-backend {
        server oidc-backend:3100;
    }

    upstream sales-backend {
        server sales-backend:3102;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Allow large file uploads (media attachments)
        client_max_body_size 50m;

        # Docker embedded DNS is 127.0.0.11, but this stack runs on rootless
        # podman where that address doesn't exist — use the sedjiwa-net gateway
        # (aardvark-dns) instead so dynamic upstreams (rustfs) resolve.
        resolver 10.89.0.1 valid=30s ipv6=off;

        # Tasks backend — proxy /api/tasks/ to backend (strip prefix)
        location /api/tasks/ {
            proxy_pass http://tasks-backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        # Core backend — proxy /api/core/ to backend (strip prefix)
        location /api/core/ {
            proxy_pass http://core-backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        # OIDC backend — proxy /api/oidc/ to backend (strip prefix)
        location /api/oidc/ {
            proxy_pass http://oidc-backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        # Sales backend — proxy /api/sales/ to backend (strip prefix)
        location /api/sales/ {
            proxy_pass http://sales-backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        # Media files — proxy to RustFS S3 storage (tasks-media bucket)
        # Uses variable to force runtime DNS resolution (rustfs may start after nginx)
        location /media-files/ {
            set $rustfs_upstream http://rustfs:9000;
            proxy_pass $rustfs_upstream/tasks-media/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host rustfs:9000;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_intercept_errors on;
            error_page 404 =404 /index.html;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — serve index.html for all unmatched routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
