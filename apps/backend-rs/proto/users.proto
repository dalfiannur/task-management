syntax = "proto3";
package sedjiwa.tasks.auth.v1;

// Self-contained identity: phone + password, self-register → pending → admin
// approval → active. Login mints an HS256 JWT verified by the Connect interceptor.

service AuthService {
  rpc Register(RegisterRequest) returns (User);       // public → status Pending
  rpc Login(LoginRequest) returns (LoginResponse);    // public
  rpc Me(MeRequest) returns (User);                   // authenticated
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (User);          // self
  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse); // self
}

service UserDirectoryService {
  rpc SearchUsers(SearchUsersRequest) returns (ListUsersResponse); // active → picker
  rpc GetUser(GetUserRequest) returns (User);

  // Admin
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc ActivateUser(UserIdRequest) returns (User);
  rpc SuspendUser(UserIdRequest) returns (User);
  rpc SetAdmin(SetAdminRequest) returns (User);
  rpc ResetPassword(ResetPasswordRequest) returns (OkResponse);
  rpc DeleteUser(UserIdRequest) returns (OkResponse);
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  ACTIVE = 2;
  SUSPENDED = 3;
}

message User {
  string id = 1;
  string phone = 2;
  string display_name = 3;
  string email = 4;
  string avatar_url = 5;
  UserStatus status = 6;
  bool is_admin = 7;
  string created_at = 8;
  optional string last_login_at = 9;
}

message RegisterRequest {
  string phone = 1;
  string password = 2;
  string display_name = 3;
}
message LoginRequest {
  string phone = 1;
  string password = 2;
}
message LoginResponse {
  string token = 1;
  User user = 2;
}
message MeRequest {}
message UpdateMyProfileRequest {
  optional string display_name = 1;
  optional string avatar_url = 2;
  optional string email = 3;
}
message ChangeMyPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}
message ChangeMyPasswordResponse {
  bool ok = 1;
}

message SearchUsersRequest {
  optional string q = 1; // match display_name / phone
}
message GetUserRequest {
  string id = 1;
}
message ListUsersRequest {
  optional UserStatus status = 1;
}
message ListUsersResponse {
  repeated User users = 1;
}
message CreateUserRequest {
  string phone = 1;
  string password = 2;
  string display_name = 3;
  bool is_admin = 4;
}
message UpdateUserRequest {
  string id = 1;
  optional string display_name = 2;
  optional string email = 3;
  optional string avatar_url = 4;
}
message UserIdRequest {
  string id = 1;
}
message SetAdminRequest {
  string id = 1;
  bool is_admin = 2;
}
message ResetPasswordRequest {
  string id = 1;
  string new_password = 2;
}
message OkResponse {
  bool ok = 1;
}
