syntax = "proto3";
package sedjiwa.tasks.reports.v1;

import "dashboard.proto";
import "activity.proto";

// Cross-project period reporting. Read-only aggregation over existing Task and
// Activity data — no new entities. Scope is the dashboard's: the caller's member
// projects, or all projects for an admin.
// See docs/superpowers/specs/2026-09-07-periodic-reports-design.md.
service ReportService {
  rpc GetPeriodReport(GetPeriodReportRequest) returns (PeriodReport);
  // The same report as an .xlsx workbook — one sheet per section, with the
  // task lists complete (`list_limit` is ignored; nothing is truncated).
  rpc ExportPeriodReportXlsx(ExportPeriodReportXlsxRequest) returns (ExportPeriodReportXlsxResponse);
}

message ExportPeriodReportXlsxRequest {
  GetPeriodReportRequest report = 1;
  // How the client names the period ("28 Sep – 4 Oct 2026"); the server does
  // not know the viewer's calendar.
  string label = 2;
  // "weekly" or "monthly" — the sheet title and the file name.
  string granularity = 3;
  // The viewer's offset east of UTC in minutes, so the times written into the
  // workbook are the wall-clock times the viewer sees on the page.
  int32 utc_offset_minutes = 4;
  // The app's display name, for the summary sheet.
  string app_name = 5;
}

message ExportPeriodReportXlsxResponse {
  bytes xlsx = 1;
  string file_name = 2;
}

message GetPeriodReportRequest {
  // Half-open [start, end), RFC3339 UTC. The client computes them from the
  // viewer's local calendar; the server does not know what a week is.
  string period_start = 1;
  string period_end = 2;
  // The comparison window. Both empty = no comparison.
  string prev_start = 3;
  string prev_end = 4;
  // Cap on completed_tasks / overdue_tasks. 0 = 50.
  uint32 list_limit = 5;

  // The same window as plain local calendar dates (yyyy-MM-dd), for the task
  // fields that are themselves plain dates rather than instants — `start_date`.
  //
  // These cannot be derived from the instants above. Those are local midnight
  // expressed in UTC, so for a viewer at UTC+7 the week beginning Monday
  // arrives as 2026-09-06T17:00:00, whose date prefix is the previous day.
  // The client computes these in its own local time, exactly as it does the
  // instants. Both empty is an error, not a fallback: a report that silently
  // reverted to created_at would be wrong in a way nothing on the page shows.
  string period_start_date = 6;
  string period_end_date = 7;
  // The comparison window's dates. Empty when no comparison was requested,
  // and then required to be empty together with prev_start/prev_end.
  string prev_start_date = 8;
  string prev_end_date = 9;
}

// `completed` and `started` are of the window. `still_open` and `overdue` are of
// *now* — a period cannot have a current backlog.
//
// `started` counts a task whose `start_date` falls in the window — when the
// work was scheduled to begin. A task with no `start_date` falls back to
// `created_at`, so nothing disappears from the report; the cost is that this
// one number mixes two meanings.
message PeriodTotals {
  uint32 completed = 1;
  uint32 started = 2;
  uint32 still_open = 3;
  uint32 overdue = 4;
}

message ProjectReportRow {
  string project_id = 1;
  string project_name = 2;
  uint32 completed = 3;
  uint32 started = 4;
  uint32 still_open = 5;
  uint32 overdue = 6;
  uint32 done_total = 7; // cumulative; matches DashboardStats.per_project
  uint32 total = 8;
}

message MemberReportRow {
  string user_id = 1;
  string user_name = 2;
  uint32 completed = 3; // completed in window AND assigned to them
  uint32 started = 4;   // created_by them, started in window
  uint32 open_assigned = 5;
  uint32 overdue_assigned = 6;
}

message ActivitySummaryRow {
  sedjiwa.tasks.activity.v1.EntityType entity_type = 1;
  sedjiwa.tasks.activity.v1.ActivityAction action = 2;
  uint32 count = 3;
}

message PeriodReport {
  string period_start = 1;
  string period_end = 2;

  PeriodTotals totals = 3;
  PeriodTotals prev_totals = 4; // unset when no comparison window was sent

  repeated ProjectReportRow per_project = 5;
  repeated MemberReportRow per_member = 6;

  // dashboard.v1.MyTask, not a parallel type: the frontend already has
  // mapMyTasks and a row component for it.
  repeated sedjiwa.tasks.dashboard.v1.MyTask completed_tasks = 7;
  repeated sedjiwa.tasks.dashboard.v1.MyTask overdue_tasks = 8;
  bool completed_truncated = 9;
  bool overdue_truncated = 10;

  repeated ActivitySummaryRow activity_summary = 11;
  uint32 activity_total = 12;
}
