syntax = "proto3";
package sedjiwa.tasks.project.v1;

// Local delivery-only projects. Create only; List/Get/Update live in later flows.

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (Project);

  // Owner/admin authority actions surfaced by the detail shell.
  rpc SetProjectStatus(SetProjectStatusRequest) returns (Project);
  rpc TransferProjectOwnership(TransferProjectOwnershipRequest) returns (Project);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // Owner/admin: mark or unmark the project as a template.
  rpc SetProjectTemplate(SetProjectTemplateRequest) returns (Project);

  // Members tab.
  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse);
  rpc AddProjectMember(AddProjectMemberRequest) returns (ListProjectMembersResponse);
  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (ListProjectMembersResponse);
  rpc LeaveProject(LeaveProjectRequest) returns (LeaveProjectResponse);
}

message Member {
  string user_id = 1;
  bool is_owner = 2; // = (user_id == project.owner_id)
}

message ListProjectMembersRequest { string project_id = 1; }
message ListProjectMembersResponse {
  repeated Member members = 1;
  string owner_id = 2;
}

message AddProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
}
message RemoveProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
}

message LeaveProjectRequest { string project_id = 1; } // user = caller
message LeaveProjectResponse { bool ok = 1; }

message CreateProjectRequest {
  string name = 1;
  optional string description = 2;
  optional string owner_id = 3; // empty → owner = caller
  // Copy another project's workflow statuses, labels, modules, tasks (with
  // subtasks, estimates and dependencies) and working days. Not copied:
  // assignees, comments, time, media, pages. Tasks start in the first To Do
  // status; cancelled ones are skipped. The caller must be a member of it.
  optional string from_project_id = 4;
  // With `from_project_id`: the new project's start. Every copied date moves
  // by (start_date − the source's start, or its earliest task date).
  optional string start_date = 5;
}

message ListProjectsRequest {
  repeated ProjectStatus status = 1; // empty = all statuses
  optional string search = 2;
  uint32 page = 3;   // 1-based; 0/absent → 1
  uint32 limit = 4;  // default 12
  // false/absent: projects only. true: templates only.
  bool templates = 5;
}
message ListProjectsResponse {
  repeated Project projects = 1;
  uint32 total = 2; // total after filtering (for pagination)
}

message GetProjectRequest { string id = 1; }

message SetProjectStatusRequest {
  string id = 1;
  ProjectStatus status = 2;
}
message TransferProjectOwnershipRequest {
  string id = 1;
  string new_owner_id = 2;
}
message DeleteProjectRequest { string id = 1; }
message DeleteProjectResponse { bool ok = 1; }
message SetProjectTemplateRequest {
  string id = 1;
  bool is_template = 2;
}

message Project {
  string id = 1;
  string name = 2;
  optional string description = 3;
  ProjectStatus status = 4;
  string owner_id = 5;
  optional string start_date = 6; // set in a later flow
  optional string end_date = 7;
  // Task progress. Set by ListProjects only; absent elsewhere. Same rules as
  // the dashboard's ProjectProgress: cancelled tasks count nowhere.
  optional TaskCounts tasks = 8;
  bool is_template = 9;
}

message TaskCounts {
  uint32 done = 1;
  uint32 total = 2;
  uint32 overdue = 3;                // due before today, not done
  optional string next_due_date = 4; // earliest due_date >= today among open tasks
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_ACTIVE = 1;
  PROJECT_STATUS_COMPLETED = 2;
  PROJECT_STATUS_ARCHIVED = 3;
}
