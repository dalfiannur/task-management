syntax = "proto3";
package sedjiwa.tasks.work.v1;

// Project → Modules → Tasks. Module CRUD is owner/admin; task CRUD is any member.
// Project is derived from the module (task → module → project).

service ModuleService {
  rpc ListModules(ListModulesRequest) returns (ListModulesResponse);
  rpc CreateModule(CreateModuleRequest) returns (Module);
  rpc UpdateModule(UpdateModuleRequest) returns (Module);
  rpc DeleteModule(DeleteModuleRequest) returns (DeleteModuleResponse);
  rpc ReorderModules(ReorderModulesRequest) returns (ListModulesResponse);
}

service TaskService {
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc MoveTask(MoveTaskRequest) returns (Task);
}

// A project's workflow: its own task statuses, each in a fixed category (the
// TaskStatus enum). Member-gated, like labels. A project always keeps at least
// one TODO and one DONE status; deleting a status moves its tasks to another.
service TaskStatusService {
  rpc ListTaskStatuses(ListTaskStatusesRequest) returns (ListTaskStatusesResponse);
  rpc CreateTaskStatus(CreateTaskStatusRequest) returns (TaskStatusDef);
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (TaskStatusDef);
  rpc DeleteTaskStatus(DeleteTaskStatusRequest) returns (DeleteTaskStatusResponse);
  rpc ReorderTaskStatuses(ReorderTaskStatusesRequest) returns (ListTaskStatusesResponse);
}

message Module {
  string id = 1;
  string name = 2;
  optional string description = 3;
  int32 order = 4;
}

message ListModulesRequest { string project_id = 1; }
message ListModulesResponse { repeated Module modules = 1; }
message CreateModuleRequest {
  string project_id = 1;
  string name = 2;
  optional string description = 3;
}
message UpdateModuleRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
}
message DeleteModuleRequest { string id = 1; }
message DeleteModuleResponse { bool ok = 1; }
message ReorderModulesRequest {
  string project_id = 1;
  repeated string module_ids = 2; // new order
}

message Task {
  string id = 1;
  string module_id = 2;
  string title = 3;
  string description = 4;
  TaskStatus status = 5;
  TaskPriority priority = 6;
  optional string start_date = 7;
  optional string due_date = 8;
  int32 order = 9;
  repeated string assignee_ids = 10;
  repeated string label_ids = 11;
  string created_at = 12;
  string updated_at = 13;
  optional string completed_at = 14;
  string created_by = 15;
  optional string parent_id = 16;
  repeated string blocked_by_ids = 17;
  // Sequential within the project (#1, #2, …); stable across moves.
  int32 number = 18;
  // The task's status in its project's workflow; `status` is its category.
  string status_id = 19;
  string status_name = 20;
  string status_color = 21;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TODO = 1;
  IN_PROGRESS = 2;
  DONE = 3;
  CANCELLED = 4;
}
enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  NONE = 1;
  LOW = 2;
  MEDIUM = 3;
  HIGH = 4;
  URGENT = 5;
}

message GetTaskRequest { string id = 1; }
message ListTasksRequest {
  string project_id = 1;
  optional string module_id = 2;
}
message ListTasksResponse { repeated Task tasks = 1; }

message CreateTaskRequest {
  string module_id = 1;
  string title = 2;
  optional string description = 3;
  TaskStatus status = 4;
  TaskPriority priority = 5;
  optional string start_date = 6;
  optional string due_date = 7;
  repeated string assignee_ids = 8;
  repeated string label_ids = 9;
  optional string parent_id = 10;
  // Wins over `status` when set; otherwise the first status of `status`'s
  // category (TODO when that is unspecified).
  optional string status_id = 11;
}
// Wrapper so a repeated field can be distinguished from "absent" on update
// (proto3 can't tell an omitted `repeated` from an empty one).
message StringList { repeated string values = 1; }

message UpdateTaskRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional TaskStatus status = 4;
  optional TaskPriority priority = 5;
  optional string start_date = 6;
  optional string due_date = 7;
  optional StringList assignee_ids = 8; // absent = unchanged; present (incl. empty) = replace
  optional StringList label_ids = 9;
  optional StringList blocked_by_ids = 10;
  // Re-parenting needs three states — leave alone, set a parent, detach to top
  // level — which a bare `optional string` cannot express (absent and "clear"
  // collapse into the same value). Reuse the StringList wrapper: absent =
  // unchanged, empty = detach, one element = that parent. Two or more is an
  // invalid argument.
  optional StringList parent_id_set = 11;
  // Wins over `status`; `status` alone picks the category's first status.
  optional string status_id = 12;
}
message DeleteTaskRequest { string id = 1; }
message DeleteTaskResponse { bool ok = 1; }
message MoveTaskRequest {
  string id = 1;
  string module_id = 2;
  int32 order = 3;
}

message TaskStatusDef {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string color = 4; // #RRGGBB
  TaskStatus category = 5;
  int32 order = 6;
}

message ListTaskStatusesRequest { string project_id = 1; }
message ListTaskStatusesResponse { repeated TaskStatusDef statuses = 1; }
message CreateTaskStatusRequest {
  string project_id = 1;
  string name = 2;
  string color = 3;
  TaskStatus category = 4;
}
message UpdateTaskStatusRequest {
  string id = 1;
  optional string name = 2;
  optional string color = 3;
  optional TaskStatus category = 4;
}
message DeleteTaskStatusRequest {
  string id = 1;
  // Where the deleted status's tasks go; required when it has any.
  optional string replacement_id = 2;
}
message DeleteTaskStatusResponse { bool ok = 1; }
message ReorderTaskStatusesRequest {
  string project_id = 1;
  repeated string status_ids = 2; // new order; must list every status
}
