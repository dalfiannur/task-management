worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    # `resolver` for the backend-rs lookup below, rendered at container start
    # from /etc/nginx/templates/resolver.conf.template with the container's own
    # nameserver (Docker's 127.0.0.11, Podman's aardvark, …).
    include /etc/nginx/conf.d/resolver.conf;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Media attachments can be large (uploads go direct-to-S3, but keep headroom).
        client_max_body_size 50m;

        # backend-rs Connect API. The frontend calls baseUrl "/api/tasks-rs"; the
        # backend serves each service at the root ("/<Service>/<Method>"), so the
        # rewrite strips the "/api/tasks-rs" prefix.
        #
        # The upstream is a variable so nginx re-resolves `backend-rs` through
        # `resolver` instead of pinning the IP it saw at startup: a literal host
        # here kept proxying to the old address after `pm-backend` was recreated
        # on its own, and every API call 502'd until nginx was reloaded. With a
        # variable, proxy_pass can't carry a URI, hence the rewrite.
        location /api/tasks-rs/ {
            set $backend_rs http://backend-rs:3010;
            rewrite ^/api/tasks-rs/(.*)$ /$1 break;
            proxy_pass $backend_rs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-streaming (StreamNotifications): push events through immediately,
            # never buffer, and allow the connection to stay open indefinitely.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Cache hashed static assets aggressively.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — TanStack Router handles client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
